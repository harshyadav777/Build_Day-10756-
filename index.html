<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Quote Saver</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.68/build/spline-viewer.js"></script>
</head>
<body>
    <spline-viewer class="profile_photo1"
                    url="https://prod.spline.design/PtNNxXyTmmNKQDfa/scene.splinecode"></spline-viewer>
    <header>
        <h1 class="title">MINI SAVER QUOTE</h1>
        <h1 class="name">by harsh yadav (10756)</h1>
    </header>
    <main class="app-container">
        

        <div class="input-box">
            <input type="text" id="quoteInput" placeholder="Write something inspiring...">
            <button id="addBtn">Save Quote</button>
        </div>

        <ul id="quoteList"></ul>

    </main>

    <script src="script.js"></script>
</body>
</html>
